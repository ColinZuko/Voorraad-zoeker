<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voorraad</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        font-size: 1.2rem;
        padding: 12px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #ddd;
      }
      .outofstock {
        color: #b00020;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        font-size: 1.1rem;
      }
      video {
        width: 100%;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <input
      id="q"
      type="search"
      list="suggestions"
      placeholder="Kleur of soort…"
      autofocus
      autocomplete="off"
    />
    <datalist id="suggestions"></datalist>
    <button id="scan" type="button">Scan barcode</button>
    <video id="video" playsinline hidden></video>
    <ul id="results"></ul>

    <script>
      const input = document.getElementById("q");
      const list = document.getElementById("results");
      let timer;
      const key = new URLSearchParams(location.search).get("key") ?? "";

      input.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(search, 250);
      });

      async function search() {
        const q = input.value.trim();
        const response = await fetch(
          "/api/search?q=" +
            encodeURIComponent(q) +
            "&key=" +
            encodeURIComponent(key),
        );
        if (!response.ok) {
          list.innerHTML = "<li>Fout of geen toegang</li>";
          return;
        }
        const products = await response.json();
        if (q !== input.value.trim()) return;

        list.innerHTML = "";
        if (q.length >= 2 && products.length === 0) {
          list.innerHTML = "<li>Niets gevonden</li>";
        }
        for (const p of products) {
          const li = document.createElement("li");
          li.className = p.status;
          li.textContent = p.name;
          const stock = document.createElement("strong");
          stock.textContent = p.stock ?? "?";
          li.append(stock);
          list.append(li);
        }
        const suggestions = document.getElementById("suggestions");
        const last = q.toLowerCase().split(" ").pop();
        const words = new Set();
        for (const p of products) {
          for (const w of p.name.toLowerCase().split(/\s+/)) {
            if (w.startsWith(last) && w !== last) words.add(w);
          }
        }
        suggestions.innerHTML = "";
        for (const w of words) {
          const option = document.createElement("option");
          option.value = q.slice(0, q.length - last.length) + w;
          suggestions.append(option);
        }
      }

      const video = document.getElementById("video");
      document.getElementById("scan").addEventListener("click", scan);
      video.addEventListener("click", () => (video.hidden = true));

      async function scan() {
        let stream;
        try {
          const { BarcodeDetector } =
            await import("https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/es/ponyfill.js");
          const detector = new BarcodeDetector({
            formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"],
          });
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "environment",
              width: { ideal: 1920 },
              height: { ideal: 1080 },
            },
          });
          video.srcObject = stream;
          video.hidden = false;
          await video.play();

          while (!video.hidden) {
            const codes = await detector.detect(video);
            if (codes.length > 0) {
              input.value = codes[0].rawValue;
              video.hidden = true;
              search();
            } else {
              await new Promise((resolve) => setTimeout(resolve, 200));
            }
          }
        } catch (error) {
          console.error(error);
          list.innerHTML = "<li>Camera niet beschikbaar</li>";
        } finally {
          video.hidden = true;
          stream?.getTracks().forEach((track) => track.stop());
        }
      }
    </script>
  </body>
</html>
